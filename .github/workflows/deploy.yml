name: Deploy Azure Resources

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      KEYVAULT_NAME: kv011
      SECRET_NAME: vmAdminPassword

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Azure Login
        run: |
          az account show

      - name: Verify Key Vault
        run: |
          az keyvault show --name "$KEYVAULT_NAME"

      - name: Check Key Vault and Get Password
        id: password
        shell: bash
        run: |

          PASSWORD=$(az keyvault secret show \
            --vault-name "$KEYVAULT_NAME" \
            --name "$SECRET_NAME" \
            --query value \
            -o tsv)

          if [ -z "$PASSWORD" ]; then

            echo "Secret not found."
            echo "Generating new password..."

            PASSWORD="Aa1!$(openssl rand -base64 32 | tr -d '\n' | tr '/+' 'XY' | cut -c1-24)"

            az keyvault secret set \
              --vault-name $KEYVAULT_NAME \
              --name $SECRET_NAME \
              --value "$PASSWORD"

          else

            echo "Existing password found."

          fi

          echo "ADMIN_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Deploy Bicep
        run: |

          az deployment sub create \
            --location eastus \
            --template-file Main.bicep \
            --parameters dev.bicepparam \
            --parameters adminPassword="$ADMIN_PASSWORD"